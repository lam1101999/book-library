server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 200m;
    }
    location /files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri /index.html;
    }
}
