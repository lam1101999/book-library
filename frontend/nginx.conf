server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 200m;
    }
    location /files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    # hashed assets are immutable -> cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # pdf.js worker at a stable path — same URL forever, safe to cache long
    location = /pdf.worker.mjs {
        add_header Cache-Control "public, max-age=86400";
    }
    # index.html must never be cached, or browsers keep referencing
    # old asset hashes (e.g. the pdf.worker .mjs) that no longer exist
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
