services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no host port exposed — only the backend talks to it;
    # uncomment if you want psql access from the host:
    # ports:
    #   - "5432:5432"

  backend:
    build: ./backend
    # read backend/.env too, so key/value pairs placed there (next to the code)
    # reach the container without duplicating them in the repo-root .env.
    # Precedence: shell env > repo-root .env > backend/.env > defaults below.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      LIBRARY_DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
      LIBRARY_STORAGE_DIR: /app/data/files
      # Google OAuth (optional): set these in .env to enable Google login
      LIBRARY_GOOGLE_CLIENT_ID: ${LIBRARY_GOOGLE_CLIENT_ID:-}
      LIBRARY_GOOGLE_CLIENT_SECRET: ${LIBRARY_GOOGLE_CLIENT_SECRET:-}
      # e.g. http://localhost:8080 — must match the redirect URI registered in Google Console
      LIBRARY_OAUTH_REDIRECT_BASE: ${LIBRARY_OAUTH_REDIRECT_BASE:-}
      # LLM for summarization — set in the repo-root .env (compose reads it)
      LIBRARY_LLM_BASE_URL: ${LIBRARY_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LIBRARY_LLM_API_KEY: ${LIBRARY_LLM_API_KEY:-}
      LIBRARY_LLM_MODEL: ${LIBRARY_LLM_MODEL:-z-ai/glm-5.3-flash}
      # stable JWT secret so logins survive container restarts
      LIBRARY_JWT_SECRET: ${LIBRARY_JWT_SECRET:-}
    volumes:
      - uploads:/app/data/files
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # docker compose --profile test run --rm test
  test:
    build: ./backend
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
    volumes:
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pip install --no-cache-dir pytest httpx && python -m pytest -v"

volumes:
  pgdata:
  uploads:
